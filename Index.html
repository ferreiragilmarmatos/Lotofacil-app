<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#14532d">
  <title>Lotofácil — Resultados</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 18px; background: #f3f4f6;
      color: #17202a; font: 16px system-ui, sans-serif;
    }
    main { max-width: 700px; margin: auto; }
    header, section, .ad {
      background: white; border-radius: 14px; padding: 18px;
      margin: 0 0 16px; box-shadow: 0 2px 10px #00000012;
    }
    h1 { margin: 0 0 6px; font-size: 25px; }
    h2 { font-size: 19px; margin-top: 0; }
    .muted { color: #64748b; font-size: 14px; }
    button, input {
      width: 100%; padding: 13px; margin: 6px 0;
      border-radius: 9px; font: inherit;
    }
    button {
      border: 0; background: #166534; color: white;
      font-weight: 700; cursor: pointer;
    }
    button.secondary { background: #334155; }
    input { border: 1px solid #cbd5e1; background: white; }
    .numbers { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0; }
    .ball {
      width: 40px; height: 40px; display: grid; place-items: center;
      border-radius: 50%; color: white; background: #15803d;
      font-weight: 700;
    }
    #status { min-height: 24px; }
    .result { border-top: 1px solid #e2e8f0; padding: 12px 0; }
    .ad {
      min-height: 85px; display: grid; place-items: center;
      border: 1px dashed #94a3b8; color: #64748b;
      box-shadow: none;
    }
  </style>
</head>
<body>
<main>
  <header>
    <h1>Lotofácil — Resultados</h1>
    <div class="muted">Resultados consultados na fonte da CAIXA.</div>
  </header>

  <section>
    <h2>Resultado mais recente</h2>
    <div id="status" class="muted">Consultando...</div>
    <div id="latest"></div>
    <button onclick="atualizar()">Atualizar resultado</button>
  </section>

  <section>
    <h2>Consultar um concurso</h2>
    <input id="contestNumber" type="number" min="1" placeholder="Digite o número do concurso">
    <button class="secondary" onclick="consultarConcurso()">Consultar e salvar</button>
  </section>

  <section>
    <h2>Histórico salvo neste celular</h2>
    <div id="count" class="muted"></div>
    <button onclick="baixarCSV()">Baixar histórico em CSV</button>
    <div id="history"></div>
  </section>

  <div class="ad">Espaço reservado para anúncios</div>
  <p class="muted">Os sorteios são aleatórios. Este app não prevê resultados nem realiza apostas.</p>
</main>

<script>
  const API = "https://servicebus2.caixa.gov.br/portaldeloterias/api/lotofacil";
  const STORAGE_KEY = "lotofacil-resultados-v1";

  function lerHistorico() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]"); }
    catch { return []; }
  }

  function salvar(resultado) {
    const historico = lerHistorico();
    const atualizado = historico.filter(item => item.numero !== resultado.numero);
    atualizado.push(resultado);
    atualizado.sort((a, b) => b.numero - a.numero);
    localStorage.setItem(STORAGE_KEY, JSON.stringify(atualizado));
    mostrarHistorico();
  }

  function formatarResultado(dados) {
    return {
      numero: Number(dados.numero),
      data: dados.dataApuracao || "",
      dezenas: (dados.listaDezenas || []).map(n => String(n).padStart(2, "0"))
    };
  }

  function mostrarResultado(resultado) {
    const bolas = resultado.dezenas
      .map(n => `<span class="ball">${n}</span>`).join("");
    document.getElementById("latest").innerHTML =
      `<strong>Concurso ${resultado.numero}</strong> — ${resultado.data}
       <div class="numbers">${bolas}</div>`;
  }

  async function buscar(url) {
    const resposta = await fetch(url);
    if (!resposta.ok) throw new Error("A CAIXA não respondeu à consulta.");
    return formatarResultado(await resposta.json());
  }

  async function atualizar() {
    const status = document.getElementById("status");
    status.textContent = "Buscando resultado na CAIXA...";
    try {
      const resultado = await buscar(API);
      salvar(resultado);
      mostrarResultado(resultado);
      status.textContent = "Resultado atualizado.";
      localStorage.setItem("lotofacil-ultima-atualizacao", new Date().toISOString());
    } catch (erro) {
      status.textContent =
        "Não foi possível consultar automaticamente. Pode ser uma instabilidade ou bloqueio do navegador. Tente novamente mais tarde.";
      const historico = lerHistorico();
      if (historico.length) mostrarResultado(historico[0]);
    }
  }

  async function consultarConcurso() {
    const numero = document.getElementById("contestNumber").value;
    if (!numero || Number(numero) < 1) {
      alert("Digite um número de concurso válido.");
      return;
    }
    try {
      const resultado = await buscar(`${API}/${encodeURIComponent(numero)}`);
      salvar(resultado);
      mostrarResultado(resultado);
      document.getElementById("status").textContent = "Concurso consultado e salvo.";
    } catch {
      alert("Não consegui consultar esse concurso. Confira o número e tente novamente.");
    }
  }

  function mostrarHistorico() {
    const historico = lerHistorico();
    document.getElementById("count").textContent =
      `${historico.length} concurso(s) salvo(s) neste celular.`;
    document.getElementById("history").innerHTML = historico.slice(0, 10).map(item =>
      `<div class="result"><strong>Concurso ${item.numero}</strong> — ${item.data}
       <div>${item.dezenas.join(" · ")}</div></div>`
    ).join("");
  }

  function baixarCSV() {
    const historico = lerHistorico();
    if (!historico.length) {
      alert("Ainda não há resultados salvos para baixar.");
      return;
    }
    const cabecalho = ["Concurso", "Data", ...Array.from({length: 15}, (_, i) => `Dezena${i + 1}`)];
    const linhas = historico.map(item => [
      item.numero, item.data, ...item.dezenas
    ]);
    const csv = [cabecalho, ...linhas]
      .map(linha => linha.map(celula => `"${String(celula).replaceAll('"', '""')}"`).join(";"))
      .join("\n");
    const arquivo = new Blob(["\uFEFF" + csv], {type: "text/csv;charset=utf-8"});
    const link = document.createElement("a");
    link.href = URL.createObjectURL(arquivo);
    link.download = "historico-lotofacil.csv";
    link.click();
    URL.revokeObjectURL(link.href);
  }

  mostrarHistorico();
  const salvo = lerHistorico();
  if (salvo.length) mostrarResultado(salvo[0]);

  // Atualiza automaticamente ao abrir, no máximo uma vez por dia.
  const ultima = localStorage.getItem("lotofacil-ultima-atualizacao");
  if (!ultima || Date.now() - new Date(ultima).getTime() > 24 * 60 * 60 * 1000) {
    atualizar();
  } else {
    document.getElementById("status").textContent =
      "Resultado salvo. Toque em “Atualizar resultado” para consultar novamente.";
  }
</script>
</body>
</html>
